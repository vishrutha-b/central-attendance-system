# SonarQube / SonarCloud Project Configuration
sonar.projectKey=central-attendance-system
sonar.projectName=Central Attendance Management System
sonar.projectVersion=1.0.0

# Source & Test paths
sonar.sources=app
sonar.tests=tests

# Exclusions
sonar.exclusions=**/__pycache__/**, **/*.pyc, docs/**, generate_*.py
sonar.coverage.exclusions=tests/**, scripts/**, generate_*.py

# Language & Coverage
sonar.language=py
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=reports/*.xml
