name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-and-scan:
    name: Build, Test & Security Pipeline
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DB_NAME: cams_test
      JWT_SECRET: test_secret_key_at_least_32_characters_long_for_security
      INITIAL_ADMIN_PASSWORD: TestAdminPassword123!
      EMAIL_DELIVERY_MODE: disabled
      COMPANY_TIMEZONE: Asia/Kolkata

    steps:
      # ─── 1. CHECKOUT CODE ──────────────────────────────────────────────────
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history required for SonarQube analysis & GitLeaks

      # ─── 2. SET UP PYTHON ──────────────────────────────────────────────────
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ─── 3. INSTALL DEPENDENCIES ───────────────────────────────────────────
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov bandit==1.8.0 pip-audit==2.7.3

      # ─── 4. CHECK PYTHON SYNTAX ────────────────────────────────────────────
      - name: Check Python Syntax
        run: |
          python -m compileall app/ tests/ scripts/

      # ─── 5. CODE QUALITY CHECK ─────────────────────────────────────────────
      - name: Code Quality Check (Ruff Linter)
        run: |
          ruff check app/ tests/ scripts/

      # ─── 6. RUN UNIT TESTS ─────────────────────────────────────────────────
      - name: Run Unit Tests
        run: |
          mkdir -p reports
          pytest tests/unit -v --cov=app --cov-report=xml:coverage.xml --cov-report=term --junitxml=reports/unit-tests.xml

      # ─── 7. RUN API TESTS ──────────────────────────────────────────────────
      - name: Run API Tests
        run: |
          pytest tests/api -v --junitxml=reports/api-tests.xml

      # ─── 8. SECURITY SCAN ──────────────────────────────────────────────────
      - name: Run Bandit (SAST Security Scan)
        run: |
          bandit -r app/ -ll -s B104

      - name: Run Pip-Audit (Dependency Vulnerability Scan)
        run: |
          pip-audit -r requirements.txt
        continue-on-error: true

      - name: Run Gitleaks (Secret Leak Detection)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # ─── 9. SONARQUBE SCAN ────────────────────────────────────────────────
      - name: SonarQube / SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        continue-on-error: true

      # ─── 10. BUILD DOCKER IMAGE ────────────────────────────────────────────
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t central-attendance-system:${{ github.sha }} .

      # ─── 11. DOCKER IMAGE SCAN ─────────────────────────────────────────────
      - name: Docker Image Scan (Trivy Vulnerability Scan)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: central-attendance-system:${{ github.sha }}
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

      # ─── 12. UPLOAD TEST RESULTS ───────────────────────────────────────────
      - name: Upload Test Results & Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-reports
          path: |
            reports/
            coverage.xml
          retention-days: 14
