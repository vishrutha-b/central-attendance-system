name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── 1. CODE QUALITY & LINTING ─────────────────────────────────────────────
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.8.4

      - name: Run Ruff Lint Check
        run: ruff check app/ tests/ scripts/

  # ─── 2. SECURITY SCANS (SAST, DEPENDENCIES & SECRETS) ─────────────────────
  security-scan:
    name: Security Scans (SAST, Dependencies & Secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit==1.8.0 pip-audit==2.7.3

      - name: Run Bandit (SAST Code Scan)
        run: bandit -r app/ -ll -s B104

      - name: Run Pip-Audit (Dependency Vulnerability Scan)
        run: pip-audit -r requirements.txt
        continue-on-error: true

      - name: Run Gitleaks (Secret Leak Detection)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ─── 3. AUTOMATED TESTING ──────────────────────────────────────────────────
  test:
    name: Automated Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: [lint]
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DB_NAME: cams_test
      JWT_SECRET: test_secret_key_at_least_32_characters_long_for_security
      INITIAL_ADMIN_PASSWORD: TestAdminPassword123!
      EMAIL_DELIVERY_MODE: disabled
      COMPANY_TIMEZONE: Asia/Kolkata

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        run: pytest -v --durations=10

  # ─── 4. DOCKER BUILD & CONTAINER SECURITY SCAN ────────────────────────────
  docker-scan:
    name: Docker Build & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t central-attendance-system:${{ github.sha }} .

      - name: Run Trivy Container Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: central-attendance-system:${{ github.sha }}
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"
