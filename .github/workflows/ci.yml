name: CI/CD Pipeline

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. FRONTEND: LINTING, SYNTAX & CLIENT-SIDE SECURITY
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-verification:
    name: Frontend Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify JavaScript Syntax
        run: |
          echo "🔍 Checking JavaScript syntax..."
          node --check static/js/app.js
          node --check static/js/api.js

      - name: Install Frontend Linters
        run: |
          npm install --no-save htmlhint eslint @eslint/js globals

      - name: Run HTMLHint (HTML Structure & Security)
        run: |
          echo "🔍 Validating HTML markup..."
          npx htmlhint "static/**/*.html" --rules "tag-pair=true,spec-char-escape=true,id-unique=true,attr-no-duplication=true" || true

      - name: Run ESLint (Client-side JavaScript Quality & Hygiene)
        run: |
          echo "🔍 Linting JavaScript files..."
          npx eslint static/js/ --env es2022,browser || true

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. BACKEND: SYNTAX, RUFF LINTING & MYPY TYPE CHECKING
  # ─────────────────────────────────────────────────────────────────────────────
  backend-quality:
    name: Backend Quality (Ruff & MyPy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Check Python Syntax (Byte-compile)
        run: |
          python -m compileall app/ tests/ scripts/

      - name: Install Linters & Type Checker
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.8.4 mypy==1.13.0

      - name: Run Ruff Linter
        run: |
          echo "🔍 Running Ruff linter..."
          ruff check app/ tests/ scripts/

      - name: Run Ruff Formatter Check
        run: |
          echo "🔍 Running Ruff format check..."
          ruff format --check app/ tests/ scripts/ || true

      - name: Run MyPy Static Type Check
        run: |
          echo "🔍 Running MyPy type analysis..."
          mypy --explicit-package-bases --ignore-missing-imports app/ || true

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. SECURITY SCANS: SAST, DEPENDENCY VULNERABILITIES & SECRET LEAKS
  # ─────────────────────────────────────────────────────────────────────────────
  security-scans:
    name: Security Scans (Bandit, Audit, Semgrep & Secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit==1.8.0 pip-audit==2.7.3 safety

      - name: Run Bandit (Python SAST Scan)
        run: |
          echo "🛡️ Running Bandit static application security testing..."
          bandit -r app/ -ll -s B104

      - name: Run Pip-Audit (Dependency Vulnerability Scanner)
        run: |
          echo "🛡️ Auditing Python dependencies against advisory databases..."
          pip-audit -r requirements.txt || true

      - name: Run Safety Scan (Dependency Vulnerabilities)
        run: |
          echo "🛡️ Running Safety dependency check..."
          safety scan --file=requirements.txt || safety check -r requirements.txt || true

      - name: Run Semgrep SAST (Frontend & Backend OWASP Top 10)
        run: |
          python -m pip install semgrep
          echo "🛡️ Scanning for OWASP vulnerabilities across frontend & backend..."
          semgrep scan --config auto --severity ERROR --error || true

      - name: Run Gitleaks (Secret Leak Detection)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. TEST SUITE: AUTOMATED UNIT & INTEGRATION TESTS
  # ─────────────────────────────────────────────────────────────────────────────
  test-suite:
    name: Automated Unit & API Tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DB_NAME: cams_test
      JWT_SECRET: test_secret_key_at_least_32_characters_long_for_security
      INITIAL_ADMIN_PASSWORD: TestAdminPassword123!
      EMAIL_DELIVERY_MODE: disabled
      COMPANY_TIMEZONE: Asia/Kolkata

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run Unit Tests with Coverage
        run: |
          mkdir -p reports
          pytest tests/unit -v --cov=app --cov-report=xml:coverage.xml --cov-report=term --junitxml=reports/unit-tests.xml

      - name: Run API Integration Tests
        run: |
          pytest tests/api -v --junitxml=reports/api-tests.xml

      - name: Upload Test Results & Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-reports
          path: |
            reports/
            coverage.xml
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. CODE QUALITY GATE: SONARQUBE / SONARCLOUD
  # ─────────────────────────────────────────────────────────────────────────────
  sonarqube:
    name: SonarQube Quality Gate
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-verification, security-scans, test-suite]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Coverage Reports
        uses: actions/download-artifact@v4
        with:
          name: test-and-coverage-reports
        continue-on-error: true

      - name: Check SonarQube Token Configuration
        id: check_sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ Notice: SONAR_TOKEN secret is not configured in repository secrets. Skipping scan."
          fi

      - name: Run SonarQube / SonarCloud Scanner
        if: steps.check_sonar.outputs.has_token == 'true'
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # 6. DOCKER: HADOLINT, MULTI-TIER BUILD & TRIVY SECURITY VULNERABILITY SCAN
  # ─────────────────────────────────────────────────────────────────────────────
  docker-build-and-security:
    name: Docker Build & Container Security Scan
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-verification, security-scans, test-suite]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Hadolint (Dockerfile Best Practices & Security Linter)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
        continue-on-error: true

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Packaging Frontend & Backend)
        run: |
          echo "🐳 Building Docker image..."
          docker build \
            --tag cams-app:${{ github.sha }} \
            --tag cams-app:latest \
            .

      - name: Run Trivy Vulnerability Scanner on Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cams-app:${{ github.sha }}
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Run Trivy Config Scanner (Dockerfile & Compose Security)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          hide-progress: true
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

      - name: Generate Trivy SARIF Report for GitHub Security Tab
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: cams-app:${{ github.sha }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
        continue-on-error: true

      - name: Upload Trivy SARIF Scan to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
        continue-on-error: true
