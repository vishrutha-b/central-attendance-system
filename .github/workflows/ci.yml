name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── 1. ROOT STAGE: SYNTAX & INITIAL SETUP ─────────────────────────────────
  syntax-and-setup:
    name: Syntax & Base Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Check Python Syntax
        run: |
          python -m compileall app/ tests/ scripts/

  # ─── 2. BRANCH A: CODE QUALITY & TYPE CHECKING ─────────────────────────────
  code-quality:
    name: Code Quality (Ruff & MyPy)
    runs-on: ubuntu-latest
    needs: [syntax-and-setup]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linter & Type Checker
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.8.4 mypy==1.13.0

      - name: Run Ruff Linter
        run: ruff check app/ tests/ scripts/

      - name: Run MyPy Static Type Check
        run: mypy --explicit-package-bases --ignore-missing-imports app/
        continue-on-error: true

  # ─── 3. BRANCH B: SECURITY SCANS ───────────────────────────────────────────
  security-scans:
    name: Security Scans (SAST, Audit, Safety & Secrets)
    runs-on: ubuntu-latest
    needs: [syntax-and-setup]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit==1.8.0 pip-audit==2.7.3 safety

      - name: Run Bandit (SAST Code Scan)
        run: bandit -r app/ -ll -s B104

      - name: Run Pip-Audit (Dependency Vulnerability Scan)
        run: pip-audit -r requirements.txt
        continue-on-error: true

      - name: Run Safety (Dependency Security Checks)
        run: safety scan --file=requirements.txt || safety check -r requirements.txt || true
        continue-on-error: true

      - name: Run Gitleaks (Secret Leak Detection)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ─── 4. BRANCH C: AUTOMATED TESTS ──────────────────────────────────────────
  test-suite:
    name: Automated Unit & API Tests
    runs-on: ubuntu-latest
    needs: [syntax-and-setup]
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DB_NAME: cams_test
      JWT_SECRET: test_secret_key_at_least_32_characters_long_for_security
      INITIAL_ADMIN_PASSWORD: TestAdminPassword123!
      EMAIL_DELIVERY_MODE: disabled
      COMPANY_TIMEZONE: Asia/Kolkata

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run Unit Tests
        run: |
          mkdir -p reports
          pytest tests/unit -v --cov=app --cov-report=xml:coverage.xml --cov-report=term --junitxml=reports/unit-tests.xml

      - name: Run API Tests
        run: |
          pytest tests/api -v --junitxml=reports/api-tests.xml

      - name: Upload Test Results & Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-reports
          path: |
            reports/
            coverage.xml
          retention-days: 14

  # ─── 5. MERGE STAGE: SONARQUBE ANALYSIS ────────────────────────────────────
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [code-quality, security-scans, test-suite]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Coverage Reports
        uses: actions/download-artifact@v4
        with:
          name: test-and-coverage-reports
        continue-on-error: true

      - name: SonarQube / SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        continue-on-error: true

  # ─── 6. FINAL STAGE: DOCKER BUILD & TRIVY SCAN ─────────────────────────────
  docker-build-and-scan:
    name: Docker Build & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [sonarqube]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t central-attendance-system:${{ github.sha }} .

      - name: Run Trivy Container Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: central-attendance-system:${{ github.sha }}
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"
