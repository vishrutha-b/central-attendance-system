version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: cams_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: cams_dev
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cams_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cams_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - cams_network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cams_scheduler
    restart: unless-stopped
    command: ["python", "-m", "app.workers.scheduler"]
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
    depends_on:
      mongodb:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - cams_network

networks:
  cams_network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
